name: raptor_vs_global
version: "1.0"
description: "A/B test: RAPTOR hierarchical retrieval vs standard Global mode on HotpotQA"

shared:
  dataset:
    name: hotpotqa
    split: test
    max_samples: 100
    auto_download: true
  graphrag:
    working_dir: ./benchmark_workdirs/ab_raptor_global
    enable_llm_cache: true
  metrics: [exact_match, token_f1, context_recall]

variant_a:
  label: global
  query:
    modes: [global]

variant_b:
  label: raptor
  query:
    modes: [raptor]
    param_overrides:
      max_tree_levels: 3
      cluster_method: gmm
      top_k_cluster: 5

output:
  results_dir: ./benchmark_results/ab_raptor_vs_global
