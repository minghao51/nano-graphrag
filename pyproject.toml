[project]
name = "nano-graphrag"
version = "0.0.9.0"
description = "A simple, easy-to-hack GraphRAG implementation"
readme = "README.md"
authors = [{name = "Jianbai Ye"}]
requires-python = ">=3.11"
license = {text = "MIT"}

# Core dependencies - required for basic functionality
dependencies = [
    "future>=1.0.0",
    "numpy>=1.26.0",
    "openai",
    "tiktoken>=0.7.0",
    "networkx>=3.0",
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "node2vec>=0.4.0",
    "hnswlib>=0.8.0",
    "msgpack>=1.0.0",
    "tenacity>=8.0.0",
    "pydantic>=2.0.0",
    "litellm>=1.83.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.0.0",
    "xxhash",
    "structlog>=24.0.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]

# Optional dependencies - install based on needs
[project.optional-dependencies]
viz = [
    "pyvis>=0.3",
]
cli = [
    "typer>=0.12.0",
]
docs = [
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.25.0",
    "mike>=2.0.0",
    "matplotlib>=3.5.0",
]
opinion = [
    "neo4j",
    "anthropic",
    "aioboto3",
    "gliner2",
    "sentence-transformers",
    "transformers",
    "pymilvus",
    "qdrant-client",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "types-networkx",
    "types-PyYAML",
    "types-hnswlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
nano-graphrag = "nano_graphrag._cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nano_graphrag"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.15.0",
    "pip-audit>=2.8.0",
    "types-hnswlib>=0.8.0.20250227",
    "types-networkx>=3.4.2.20250509",
    "types-pyyaml>=6.0.12.20250915",
    "nbformat>=5.10.4",
    "jupyter>=1.1.1",
    "pip>=26.1",
    "pygments>=2.20.0",
    "mkdocs-jupyter>=0.26.3",
    "hypothesis>=6.152.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = ["examples/**", "tests/**", "bench/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "unit: fast tests with no I/O or external dependencies",
    "integration: tests requiring live services (LLM APIs, databases)",
    "slow: tests taking >1s (additive, stacked on primary marker)",
    "benchmark: benchmark and comparison tests in tests/benchmark/",
    "property: hypothesis-based property tests",
    "metamorphic: metamorphic relation tests",
    "contract: API surface and signature tests",
    "differential: reference comparison tests",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = [
    "examples/",
    "tests/",
    "bench/",
    "dist/",
    "build/",
]

[tool.mypy-pydantic_settings]
disable_error_code = ["call-arg"]

[tool.coverage.run]
source = ["src/nano_graphrag"]
omit = [
    "src/nano_graphrag/_storage/gdb_neo4j.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "logger.",
]
