# Pre-commit hooks for nano-graphrag
# See https://pre-commit.com for more information

repos:
  # Dotenvx hook - ensure .env files are encrypted before commit
  - repo: local
    hooks:
      - id: dotenvx-check
        name: dotenvx - prevent committing .env files
        entry: dotenvx ext precommit
        language: system
        pass_filenames: false
        always_run: true

  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(notebooks/_freeze/|docs/notebooks/html/)
      - id: end-of-file-fixer
        exclude: ^(notebooks/_freeze/|docs/notebooks/html/)
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: ^docs/notebooks/html/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # UV lock validation
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.6.14
    hooks:
      - id: uv-lock

  # Python linting & formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/

  # Quarto notebook rendering
  - repo: local
    hooks:
      - id: quarto-render
        name: Render changed .qmd notebooks
        entry: make notebooks-staged
        language: system
        files: '^notebooks/.*\.qmd$'
        pass_filenames: false

  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/nano_graphrag
        language: system
        types: [python]
        pass_filenames: false
