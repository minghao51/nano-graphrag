site_name: nano-graphrag
site_url: https://minghao51.github.io/nano-graphrag/
repo_url: https://github.com/minghao51/nano-graphrag
repo_name: minghao51/nano-graphrag
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
nav:
  - Home: index.md
  - Notebooks:
      - Overview: notebooks/index.md
      - Quick Start: notebooks/01_quick_start.ipynb
      - Query Modes: notebooks/02_query_modes.ipynb
      - Configuration: notebooks/03_configuration.ipynb
      - Storage & Extraction: notebooks/04_storage_and_extraction.ipynb
      - Refinement & Vault: notebooks/05_refinement_and_vault.ipynb
  - Architecture:
      - System Design: architecture/architecture.md
      - Pipeline: pipeline.md
  - Guides:
      - FAQ: guides/faq.md
      - Neo4j Setup: guides/neo4j.md
  - Benchmarks:
      - Overview: benchmarks/README.md
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - toc:
      permalink: true
plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      theme: light
      include: ["*.ipynb"]
      allow_errors: true
      include_source: true
      ignore_h1_titles: true
extra_css:
  - stylesheets/jupyter-fix.css
extra_javascript:
  - javascripts/jupyter-theme-bridge.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/minghao51/nano-graphrag
